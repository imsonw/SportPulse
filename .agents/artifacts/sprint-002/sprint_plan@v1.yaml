sprint_goal: >-
  Live Scores hoạt động end-to-end: fetch + cache bằng TanStack Query, render bằng FlashList,
  cập nhật tỉ số realtime qua WebSocket bằng cách mutate cache thay vì refetch. Kết thúc sprint:
  tab Trực tiếp hiện danh sách trận đấu thật (từ mock server), bấm vào xem chi tiết có prefetch,
  tỉ số tự cập nhật khi có event WebSocket, không còn dữ liệu placeholder cứng.

learning_mode:
  enabled: true
  skill: learn-then-build
  rationale: >-
    Tiếp tục cadence của Sprint 1: mỗi task là 1 khái niệm = 1 buổi học qua gate quiz. Sprint này
    nặng về thay đổi mental model nhiều nhất trong cả roadmap — từ "state quản lý tay qua
    useState/reducer + Redux-Saga" sang "server state là cache, không phải state" (TanStack Query)
    và "mutate cache trực tiếp thay vì dispatch action" (điểm khác biệt lớn nhất so với Redux-Saga
    cũ, cần đào sâu nhất).
  cadence: "1 khái niệm = 1 buổi; tối đa 1 file được viết mỗi lượt (trừ khi phá lệ #2 — lặp pattern)"
  gate: >-
    Mỗi task phải qua quiz bắt buộc (3-5 câu, người học trả lời bằng chữ, Claude chấm) TRƯỚC khi
    được viết code. Chưa qua gate thì không tạo file.
  carry_over_from_sprint_1: >-
    concept_log.yaml ghi nhận người học từng lẫn giữa "object mới mỗi render luôn là vấn đề" và
    "chỉ là vấn đề khi phá vỡ memo" (C-021) — sprint này có FlashList/list dài, đúng ngữ cảnh cần
    memo thật, sẽ nhắc lại điểm này khi tới buổi liên quan.

