  - id: R-004
    topic: "Native Module — background thread & bảo mật"
    status: pending
    questions_seed:
      - "Xử lý tác vụ nền nặng (giải nén, hash, tải file ngầm) ở native layer sao cho không block UI thread"
      - "Cách export method/callback/Promise sang JS side, emit event về RN"
