  - id: R-006
    topic: "Behavioral & Client Communication (English)"
    status: pending
    questions_seed:
      - "Client US/EU đưa deadline phi thực tế — negotiate scope hoặc đề xuất giải pháp kỹ thuật thay thế thế nào"
      - "Requirement mơ hồ từ remote client — cách làm rõ edge case, chuyển user story mơ hồ thành task kỹ thuật cụ thể"
      - "Bất đồng kiến trúc trong team (Redux-Toolkit vs Saga, cấu trúc shared codebase) — xử lý sao"
      - "Daily Scrum trong team hybrid/distributed — đảm bảo transparency về blocker"
