  - id: TASK-28
    owner: QA
    description: >-
      Convention audit → `convention_audit_passed`. Kiểm đủ:
      (1) Route trong `app/` không chứa business logic hay fetch trực tiếp;
      (2) Không có màu/spacing hardcode trong component — đọc từ `src/theme`;
      (3) Không có URL/domain hardcode ngoài `app.json` và `src/lib/env.ts` (grep);
      (4) Không file nào trong `ios/` bị sửa tay — mọi cấu hình native qua app.json plugin;
      (5) tsconfig `strict: true`, không có `any` ngầm hay `@ts-ignore` mới;
      (6) Cấu trúc thư mục khớp thiết kế `app/ | src/features | src/components | src/stores | src/lib | modules/`.
    depends_on: [TASK-26, TASK-27]

