- id: C-024
  concept: "Safe area & edge-to-edge — insets khác padding cố định"
  task: TASK-24
  date: '2026-09-09'
  gate: retried
  weak_points:
  - 'Câu 1+2: đánh giá ngược mức độ rủi ro — nghĩ "fullscreen" (recap) là an toàn hơn nên không cần
    safe area (sai, ngược lại, không header/tab bar = rủi ro CAO nhất); và nghĩ quiz-room (có header)
