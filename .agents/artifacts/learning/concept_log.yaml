  - 'Không sinh file mới. Kiểm chứng thực nghiệm trên Simulator (xcrun simctl openurl) qua 3 kịch bản:
    (1) warm start ổn định — vào đúng match/123; (2) warm start gọi openurl NGAY SÁT lúc app vừa lên
