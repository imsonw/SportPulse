concepts:
- id: C-001
  concept: Continuous Native Generation (CNG) — vì sao 'managed vs bare' không còn là lựa chọn nhị phân
  task: TASK-1
  date: 2026-09-07
  gate: passed
  weak_points:
  - 'Câu 2 (silent drift): lần đầu chỉ trả lời chung chung ''conflict code lẫn nhau'', chưa nêu được cơ
    chế cụ thể — app.json đổi nhưng ios/ đã commit không tự đồng bộ, không ai báo lỗi. Đã chốt lại và
    hỏi follow-up, qua ở lần 2.'
  - 'Câu 4 (eject vs prebuild): đáp án đúng (''không đồng nghĩa'') nhưng tự nhận chưa hiểu vì sao. Cần
    chốt: ranh giới là HÀNH VI (có sửa tay native hay không), không phải trạng thái filesystem (có thư
    mục ios/ hay không).'
  files_written:
  - Toàn bộ scaffold qua create-expo-app (App.tsx, index.ts, app.json, package.json, tsconfig.json, .gitignore)
    — không phải code tự tay viết, mà là quan sát/giải thích output sinh ra, đúng tinh thần buổi học này.
- id: C-002
  concept: app.json là single source of truth cho cấu hình native — ranh giới với app.config.ts
  task: TASK-2
  date: '2026-09-07'
  gate: passed
  weak_points:
  - 'Câu 4 (slug vs bundleIdentifier): lúc đầu chưa biết slug là gì / EAS là gì. Sau khi giải thích EAS
    là dịch vụ cloud riêng của Expo và gợi ý bằng câu hỏi nhỏ hơn, tự kết luận đúng: ''slug chỉ dùng cho
    Expo thôi''. Nhớ: nếu sau này đụng EAS Build/Submit lại thấy lạ, nhắc lại điểm này.'
  files_written:
  - 'app.json (chỉnh sửa: name, slug, scheme, ios.bundleIdentifier, android.package)'
- id: C-003
  concept: New Architecture — JSI/Fabric/TurboModule/Codegen, đối chiếu Bridge cũ
  task: TASK-3
  date: '2026-09-08'
  gate: passed
  weak_points: []
  files_written:
  - 'Không sửa file nào. Phát hiện qua tra cứu docs.expo.dev/v57.0.0: SDK 55+ chạy New Architecture vô
    điều kiện, field newArchEnabled bị bỏ qua và Expo khuyến nghị không đặt. Đã xác nhận app.json không
    có field này — đúng khuyến nghị, không cần thêm gì.'
- id: C-004
  concept: Expo Dev Client vs Expo Go — vì sao Go không đủ cho dự án này
  task: TASK-4
  date: '2026-09-08'
  gate: passed
  weak_points:
  - 'Phần phân biệt app riêng vs app SportPulse: người học ban đầu chưa rõ Dev Client là app riêng hay
    chính app SportPulse. Đã giải thích rõ: Dev Client chính là bản build SportPulse của chính dự án (gắn
    thêm menu dev), khác hoàn toàn ứng dụng Expo Go chung trên App Store.'
  files_written:
  - package.json (thêm dependency expo-dev-client)
- id: C-005
  concept: Config Plugin — khai báo quyền và cấu hình native bằng JavaScript
  task: TASK-5
  date: '2026-09-08'
  gate: passed
  weak_points:
  - 'Hỏi thêm về khả năng Localize xin quyền: Đã giải thích cơ chế InfoPlist.strings (iOS) và strings.xml
    (Android) cũng như vai trò của message trong app.json đóng vai trò Fallback Language.'
  files_written:
  - app.json (khai báo mảng plugins cho expo-audio, expo-haptics, expo-notifications)
- id: C-006
  concept: Vòng đời prebuild — ios/ sinh ra, bị xoá, và vì sao phải nằm trong .gitignore
  task: TASK-6
  date: '2026-09-08'
  gate: passed
  weak_points:
  - 'Phân biệt gói autolink vs gói dùng config plugin: lúc đầu đưa cả expo-haptics vào plugins[] trong
    app.json gây lỗi CLI loader. Đã giải thích rõ: chỉ các gói cần can thiệp InfoPlist/Manifest mới cần
    plugin, còn gói thuần native autolink như expo-haptics thì tự động nhận.'
  files_written:
  - .gitignore (cập nhật nhận diện rõ CNG artifacts /ios, /android)
  - app.json (gỡ expo-haptics khỏi plugins array)
- id: C-007
  concept: tsconfig strict thực sự bật những gì, và vì sao nó quan trọng hơn khi bỏ Redux
  task: TASK-7
  date: '2026-09-08'
  gate: passed
  weak_points:
  - 'Nhắc nhở phân biệt 2 cách xử lý undefined: Safe Access (optional chaining ?.) thích hợp cho inline
    render UI, nhưng với các luồng màn hình chính nên ưu tiên Early Return / Type Guard để không render
    khung rỗng khi chưa có dữ liệu.'
  files_written:
  - 'tsconfig.json (xác minh cấu hình strict: true và chạy sạch npx tsc --noEmit)'
- id: C-008
  concept: Module resolution hai tầng — TypeScript typecheck khác Metro bundle
  task: TASK-8
  date: '2026-09-08'
  gate: passed
  weak_points:
  - 'Phát hiện deprecation trong TS 6.0: baseUrl bị deprecate khi dùng paths tương đối trong TS 5.4+/6.0+.
    Cấu hình sạch chỉ cần paths: { "@/*": ["./src/*"] } trong tsconfig.json.'
  files_written:
  - tsconfig.json (cấu hình paths alias @/* -> ./src/* chuẩn TypeScript 6.0)
- id: C-009
  concept: ESLint và Prettier là hai công việc khác nhau, không phải một
  task: TASK-9
  date: '2026-09-08'
  gate: passed
  weak_points:
  - 'Phân biệt rõ 2 loại QA script: npm run lint (bắt bug/code smell qua ESLint) và npm run format:check
    (soi quy chuẩn format qua Prettier). Không lạm dụng ESLint để fix formatting.'
  files_written:
  - .eslintrc.js (cấu hình expo + prettier rules)
  - .prettierrc (cấu hình singleQuote, trailingComma, printWidth)
  - .prettierignore (loại trừ artifacts/ và node_modules/)
  - package.json (bổ sung scripts typecheck, lint, format, format:check)
- id: C-010
  concept: File-based routing — cấu trúc thư mục chính là bảng route
  task: TASK-10
  date: '2026-09-08'
  gate: passed
  weak_points:
  - 'Câu 1: dùng router.navigate thay vì router.push — đã làm rõ sự khác biệt: push luôn thêm màn mới
    vào Stack, navigate giật về màn đã có nếu tồn tại trong Stack.'
  - Thói quen viết "match/456" thiếu dấu / ở đầu — trong Expo Router URL phải tính từ gốc, bắt đầu bằng
    / để tránh resolve sai khi nested sâu.
  files_written:
  - index.ts (đổi entry point từ App.tsx sang expo-router/entry)
  - app/_layout.tsx (Root Stack Navigator tối thiểu)
- id: C-011
  concept: Layout lồng nhau — _layout.tsx là COMPONENT, không phải file cấu hình
  task: TASK-11
  date: '2026-09-08'
  gate: passed
  weak_points:
  - 'Đã trả lời chuẩn 3/3 câu gate quiz: giải thích chính xác lỗi silent failure 0x0 khi thiếu flex: 1
    ở GestureHandlerRootView, rủi ro unmount/mount khi đặt sai chỗ ở từng màn con, và lý do SafeAreaProvider
    phải bọc ngoài Stack để useSafeAreaInsets lấy tọa độ chính xác.'
  files_written:
  - app/_layout.tsx (bọc GestureHandlerRootView + SafeAreaProvider quanh Stack)
  - eslint.config.js (nâng cấp Flat Config chuẩn ESLint 9 cho Expo SDK 57)
- id: C-012
  concept: Route group (tabs) — thư mục có mà URL không có
  task: TASK-12
  date: '2026-09-08'
  gate: retried
  weak_points:
  - 'Câu 2: đảo ngược (tabs) và [id] ở lần đầu — nói (tabs) ảnh hưởng URL, [id] không, dù Câu 1 cùng lượt
    trả lời đúng. Có thể do liệt kê nhanh, không phải hiểu sai gốc — nhưng đáng nhắc nếu buổi sau lại
    lẫn lộn ngoặc tròn (group) với ngoặc vuông (dynamic segment).'
  - 'Câu 4: nói ''không cần Tab Navigator'' — sai khung. Tab Navigator không biến mất, chỉ chuyển thành
    component <Tabs> render trong _layout.tsx (nối đúng bài Buổi 11: _layout.tsx là COMPONENT). Đã tự
    sửa đúng ở lần hỏi lại.'
  files_written:
  - app/(tabs)/_layout.tsx (Tabs layout tối thiểu, chưa có Tabs.Screen — để dành TASK-13)
- id: C-013
  concept: "Tabs.Screen — prop name trỏ tới TÊN FILE, không phải đường dẫn"
  task: TASK-13
  date: '2026-09-09'
  gate: retried
  weak_points:
  - 'Câu 2 (core miss): trả lời "trivia.tsx không tự lên tab nếu không khai báo Tabs.Screen" — sai
    khung, đúng bẫy #3 đã cảnh báo ở Pha 1. Sự thật: <Tabs> tự sinh tab mặc định cho MỌI file trong
    (tabs)/, Tabs.Screen chỉ dùng để TUỲ BIẾN (icon/label/order/ẩn qua href: null), không phải điều
    kiện để tab tồn tại. Đã giảng lại và hỏi follow-up (ẩn tab bằng href: null) — trả lời đúng ở lần
    2. Nhắc lại nếu buổi sau đụng lại "file nào cần khai báo mới hiện" (ví dụ +not-found, TASK-17).'
  files_written:
  - 'app/(tabs)/_layout.tsx (thêm 3 Tabs.Screen: index/trivia/leaderboard, icon Ionicons + title tiếng Việt)'
  - 'app/(tabs)/index.tsx, trivia.tsx, leaderboard.tsx (placeholder, cùng pattern — ngoại lệ phá lệ #2)'
  - 'package.json (thêm @expo/vector-icons — người học tự chọn qua trade-off, so với expo-symbols/emoji)'
- id: C-014
  concept: "Dynamic route [id].tsx và useLocalSearchParams"
  task: TASK-14
  date: '2026-09-09'
  gate: passed
  weak_points:
  - 'Câu 2: diễn đạt hơi rối — nói "id không phải string" trong khi thực ra id LÀ string, chỉ là nó
    không bằng number 123 khi so sánh ===. Kết luận (output "Không tìm thấy") đúng, chỉ cần làm rõ
    lại phát biểu nếu buổi sau còn lẫn.'
  files_written:
  - 'app/match/[id].tsx (đọc id qua useLocalSearchParams<{ id: string }>(), hiển thị "Trận đấu #id")'
  - 'app/(tabs)/index.tsx (thêm card mẫu, router.push(''/match/123'') nối điều hướng)'
- id: C-015
  concept: "Route ngoài tab & cách ẩn tab bar cho màn fullscreen"
  task: TASK-15
  date: '2026-09-09'
  gate: retried
  weak_points:
  - 'Câu 4: gán nhầm trách nhiệm ẩn header cho Tabs.Screen ở (tabs)/_layout.tsx, trong khi recap nằm
    NGOÀI (tabs) nên Tabs.Screen không liên quan gì tới nó — header của route ngoài tab do Stack CHA
    (app/_layout.tsx) chịu trách nhiệm qua Stack.Screen options.headerShown. Đã giảng lại bảng phân
    tầng (tab bar ← vị trí thư mục, header ← navigator trực tiếp chứa route) và hỏi lại — trả lời
    đúng ở lần 2 (sửa app/_layout.tsx, thêm Stack.Screen headerShown=false).'
  files_written:
  - 'app/recap/[matchId].tsx (đọc matchId, nền đen tạm cho UX recap)'
  - 'app/_layout.tsx (thêm Stack.Screen name="recap/[matchId]" headerShown: false)'
- id: C-016
