- id: C-017
  concept: "Route đặc biệt +not-found và cú pháp catch-all [...rest]"
  task: TASK-17
  date: '2026-09-09'
  gate: retried
  weak_points:
  - 'Câu 4: nói /match (thiếu segment id) vẫn khớp [id].tsx — sai, dynamic segment yêu cầu CHÍNH XÁC
    1 segment tồn tại (dù giá trị gì cũng được), không match được với segment rỗng/thiếu. /match rơi
    vào +not-found (không có match/index.tsx trong dự án). Đã giảng lại và hỏi lại — đúng ở lần 2.
    Nhắc lại nếu buổi sau đụng catch-all optional ([[...rest]] hai lớp ngoặc, chưa dạy trong sprint
    này).'
  files_written:
  - 'app/+not-found.tsx (nút "Về trang chủ" dùng router.replace(''/''))'
